services:
  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest
    # ABS runs on port 13378 by default. If you want to change
    # the port, only change the external port
    ports:
      - 13378:80
    volumes:
      - /home/docker/docker-volumes/audiobookshelf:/config
      - /home/docker/docker-volumes/audiobookshelf:/metadata
      - /mnt/NAS/Audio/audiobooks/:/audiobooks
      - /mnt/NAS/Audio/podcasts/:/podcasts
    environment:
      - TZ=America/Toronto
    restart: unless-stopped

  webdav:
    image: hacdias/webdav:latest
    container_name: webdav
    ports:
      - "7201:6065"
    volumes:
      - /home/docker/docker-volumes/webdav/data:/data
      - /home/docker/docker-volumes/webdav/config.yml:/config.yml:ro
    command: ["-c", "/config.yml"]
    restart: unless-stopped

  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /home/docker/docker-volumes/calibre-web-automated/config:/config
      - /home/docker/docker-volumes/webdav/data/books-ingest:/cwa-book-ingest
      - /home/docker/docker-volumes/calibre-web-automated/library:/calibre-library
    ports:
      - 8083:8083
    restart: unless-stopped

  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    restart: unless-stopped
    ports:
      - "8084:8084"                     # Web UI port
    environment:
      - PUID=1000                       # User ID for file permissions
      - PGID=1000                       # Group ID for file permissions
      - TZ=Europe/London                # Your timezone (optional)
    volumes:
      - /home/docker/docker-volumes/shelfmark/config:/config          # Settings, database, cover cache
      - /home/docker/docker-volumes/webdav/data/books-ingest:/books
